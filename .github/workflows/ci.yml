name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tokens:
        name: 'Shared: generated sources match tokens/, docs tests'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm generate:check
            - run: pnpm --filter zen-docs test

    check:
        name: 'Web: format, lint, types, unit tests, build'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec vp check
            - run: pnpm exec vp test run
            - run: pnpm exec vp build

    browsers:
        name: 'Web: browsers (Chromium, Firefox, WebKit)'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      web/playwright-report
                      web/test-results
                  retention-days: 7
