<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" />
<style>
    /*
     * Sora's page setup: the canvas colour on <html>, a transparent body (an
     * opaque one would paint over the z-index −1 <Backdrop>), Inter with cv11/ss01.
     */
    html {
        background: oklch(var(--background));
    }
    body {
        background: transparent !important;
        color: oklch(var(--foreground));
        font-family: var(--font-sans);
        font-feature-settings: 'cv11', 'ss01';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    * {
        scrollbar-width: thin;
        scrollbar-color: oklch(var(--tint) / 0.14) transparent;
    }

    /* ── Docs pages, in Sora's type and surfaces ── */

    .sbdocs.sbdocs-wrapper {
        background: transparent;
        padding: 56px 32px 96px;
    }
    .sbdocs.sbdocs-content {
        max-width: 820px;
    }
    .sbdocs,
    .sbdocs p,
    .sbdocs li,
    .sbdocs td,
    .sbdocs th {
        font-family: var(--font-sans);
        color: oklch(var(--foreground));
    }
    .sbdocs p,
    .sbdocs li {
        font-size: 15px;
        line-height: 1.7;
    }

    /* h1: Sora's page title (text-4xl semibold tight) in the aurora gradient. */
    .sbdocs.sbdocs-title {
        font-size: 2.25rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        background: linear-gradient(100deg, oklch(0.98 0 0), oklch(var(--primary)) 85%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .light .sbdocs.sbdocs-title {
        background: linear-gradient(100deg, oklch(var(--foreground)), oklch(var(--primary)) 85%);
        -webkit-background-clip: text;
        background-clip: text;
    }
    .sbdocs.sbdocs-subtitle,
    .sbdocs-content > p:first-of-type {
        color: oklch(var(--muted-foreground));
        font-size: 17px;
        font-weight: 400;
    }
    .sbdocs.sbdocs-h2 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        border-bottom: 1px solid oklch(var(--tint) / 0.07);
        padding-bottom: 10px;
        margin-top: 48px;
    }
    .sbdocs.sbdocs-h3 {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.025em;
    }
    .sbdocs a {
        color: oklch(var(--primary));
        text-underline-offset: 4px;
    }

    /* Story previews: Sora's glass card. */
    .sbdocs.sbdocs-preview {
        background: linear-gradient(180deg, oklch(var(--card) / 0.82), oklch(var(--card) / 0.7));
        border: 1px solid oklch(var(--tint) / 0.07);
        border-radius: 0.75rem;
        box-shadow:
            inset 0 1px 0 hsl(0 0% 100% / 0.06),
            var(--glass-shadow);
        overflow: hidden;
    }
    .sbdocs-preview .docs-story {
        background: transparent;
    }
    .sbdocs-preview .docs-story > div:first-child {
        padding: 48px 24px;
        min-height: 200px;
    }
    .sbdocs-preview .docblock-code-toggle {
        border-color: oklch(var(--tint) / 0.07);
    }

    /* Code: muted block (Sora's code/pre base style). */
    .sbdocs :not(pre) > code {
        background: oklch(var(--muted));
        color: oklch(var(--muted-foreground));
        border: none;
        border-radius: 0.25rem;
        padding: 0.2rem 0.3rem;
        font-size: 0.875rem;
    }
    .docblock-source {
        background: oklch(var(--card) / 0.7) !important;
        border: 1px solid oklch(var(--tint) / 0.07) !important;
        border-radius: 0.75rem !important;
        box-shadow: none !important;
    }

    /* Props table: glass rows split by hairlines. */
    .docblock-argstable,
    .docblock-argstable tbody {
        box-shadow: none !important;
        border-radius: 0.75rem !important;
    }
    .docblock-argstable tbody {
        border: 1px solid oklch(var(--tint) / 0.07) !important;
    }
    .docblock-argstable tbody tr,
    .docblock-argstable tbody td {
        background: oklch(var(--card) / 0.7) !important;
        border-color: oklch(var(--tint) / 0.07) !important;
    }
    .docblock-argstable th {
        color: oklch(var(--muted-foreground)) !important;
        font-size: 0.68rem !important;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 500 !important;
    }
</style>
